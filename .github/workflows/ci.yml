name: MangaTranslator CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Job 1: Testes Unitários e de Integração ─────────────────────────────────
  unit-and-integration:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Criar imagens de teste
        run: npm run test:images

      - name: Rodar testes unitários — background
        run: npm run test:unit:background

      - name: Rodar testes unitários — content scripts
        run: npm run test:unit:content

      - name: Rodar testes unitários — popup
        run: npm run test:unit:popup

      - name: Rodar testes unitários — reader
        run: npm run test:unit:reader

      - name: Rodar testes unitários — inject
        run: npm run test:unit:inject

      - name: Rodar testes de integração
        run: npm run test:integration

  # ── Job 2: Cobertura de Código ───────────────────────────────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: unit-and-integration
    defaults:
      run:
        working-directory: tests

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Criar imagens de teste
        run: npm run test:images

      - name: Gerar relatório de cobertura
        run: npm run test:coverage

      - name: Upload cobertura para Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/coverage/lcov.info
          flags: unittests
          name: manga-translator-coverage
          fail_ci_if_error: false

      - name: Salvar relatório HTML de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: tests/coverage/
          retention-days: 30

  # ── Job 3: Lint de sintaxe dos arquivos JS ───────────────────────────────────
  syntax-check:
    name: JS Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Verificar sintaxe de todos os arquivos JS da extensão
        run: |
          echo "Verificando sintaxe dos arquivos da extensão..."
          for f in extension/*.js; do
            node --check "$f" && echo "✅ $f" || (echo "❌ $f" && exit 1)
          done

      - name: Verificar sintaxe dos arquivos de teste
        run: |
          echo "Verificando sintaxe dos testes..."
          find tests -name "*.test.js" -o -name "*.spec.js" | while read f; do
            node --check "$f" && echo "✅ $f" || (echo "❌ $f" && exit 1)
          done

  # ── Job 4: Validação do manifest.json ────────────────────────────────────────
  manifest-validation:
    name: Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Validar manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
            const required = ['manifest_version', 'name', 'version', 'permissions'];
            required.forEach(field => {
              if (!manifest[field]) { console.error('Falta campo: ' + field); process.exit(1); }
            });
            if (manifest.manifest_version !== 3) {
              console.error('manifest_version deve ser 3'); process.exit(1);
            }
            console.log('✅ manifest.json válido:', manifest.name, 'v' + manifest.version);
          "

  # ── Job 5: E2E Tests (apenas em push para main) ───────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-and-integration
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: tests

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright e browsers
        run: npx playwright install chromium --with-deps

      - name: Criar imagens de teste
        run: npm run test:images

      - name: Iniciar servidor mock (background)
        run: npm run mock:server &
        env:
          CI: true

      - name: Aguardar servidor mock
        run: npx wait-on http://localhost:3999/health --timeout 15000

      - name: Rodar testes E2E
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload screenshots de falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-${{ github.sha }}
          path: tests/test-results/
          retention-days: 7
