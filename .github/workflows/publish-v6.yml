name: Publish Manga Translator v6.0

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-v6.yml"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Release + GitHub Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
          scope: "@diesper"

      - name: Validate v6.0 metadata
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (manifest.version !== '6.0') throw new Error('manifest version must be 6.0');
          if (manifest.name !== 'Manga Translator') throw new Error('manifest name must be Manga Translator');
          if (pkg.version !== '6.0.0') throw new Error('package version must be 6.0.0');
          if (pkg.name !== '@diesper/manga-translator') throw new Error('package name must be @diesper/manga-translator');
          NODE
          test -f "docs/Documentação_V6.0.md"

      - name: Build release files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p "dist/Manga-Translator-v6.0"
          cp -R extension/. "dist/Manga-Translator-v6.0/"
          (
            cd dist
            zip -qr "Manga-Translator-v6.0.zip" "Manga-Translator-v6.0"
          )
          cp "docs/Documentação_V6.0.md" "dist/Documentação_V6.0.md"
          (
            cd dist
            sha256sum "Manga-Translator-v6.0.zip" "Documentação_V6.0.md" > SHA256SUMS.txt
          )
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # Manga Translator v6.0

          Release consolidada da arquitetura atual da extensão Chromium.

          ## Destaques

          - Service Worker Manifest V3 modularizado com estado durável, reconciliação e watchdog.
          - Persistência transacional de páginas e assets em IndexedDB.
          - Cache perceptual GTC com consultas correlacionadas.
          - Automação do Google Gemini isolada por job, com ACK real antes da finalização.
          - Auto-restore, popup, opções e Reader alinhados à arquitetura atual.
          - Documentação técnica consolidada em `Documentação_V6.0.md`.
          - Identidade pública atualizada para **Manga Translator**.

          ## Arquivos

          - `Manga-Translator-v6.0.zip` — extensão pronta para extrair e carregar como extensão sem compactação.
          - `Documentação_V6.0.md` — documentação técnica da v6.0.
          - `SHA256SUMS.txt` — checksums SHA-256 dos artefatos.

          ## Instalação

          1. Baixe `Manga-Translator-v6.0.zip`.
          2. Extraia o arquivo.
          3. Abra `chrome://extensions` ou `edge://extensions`.
          4. Ative o modo do desenvolvedor.
          5. Escolha **Carregar sem compactação**.
          6. Selecione a pasta `Manga-Translator-v6.0` extraída.
          EOF

      - name: Create or update GitHub Release v6.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v6.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG"               --title "Manga Translator v6.0"               --notes-file dist/RELEASE_NOTES.md               --latest
            gh release upload "$TAG"               dist/Manga-Translator-v6.0.zip               "dist/Documentação_V6.0.md"               dist/SHA256SUMS.txt               --clobber
          else
            gh release create "$TAG"               dist/Manga-Translator-v6.0.zip               "dist/Documentação_V6.0.md"               dist/SHA256SUMS.txt               --target "$GITHUB_SHA"               --title "Manga Translator v6.0"               --notes-file dist/RELEASE_NOTES.md               --latest
          fi

      - name: Publish @diesper/manga-translator@6.0.0 to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(npm publish --registry=https://npm.pkg.github.com --access public 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$OUTPUT" | grep -Eqi 'already exists|cannot publish over|EPUBLISHCONFLICT|409 Conflict'; then
            echo "Package 6.0.0 already exists; keeping existing published version."
            exit 0
          fi
          exit "$STATUS"
